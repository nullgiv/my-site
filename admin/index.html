
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager | Ali Givshadi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Explicit config link -->
  <link href="./config.yml" type="text/yaml" rel="cms-config-url" />

  <style>
    :root { --font-family: 'Inter', sans-serif; }
    body { font-family: var(--font-family) !important; margin: 0; background: #111; color: #fff; overflow: hidden; }
    
    /* Loading & Error Overlay */
    #status-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #09090b;
        z-index: 9999;
        transition: opacity 0.5s ease;
        text-align: center;
        padding: 20px;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
        margin-bottom: 24px;
    }
    .hidden { opacity: 0; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .status-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #fff; }
    .status-desc { font-family: monospace; color: #888; font-size: 13px; max-width: 400px; line-height: 1.6; }
    
    .cmd-box {
        background: #000;
        border: 1px solid #333;
        padding: 12px 20px;
        border-radius: 8px;
        font-family: monospace;
        color: #4ade80;
        margin-top: 20px;
        font-size: 14px;
        cursor: pointer;
    }
    .cmd-box:hover { border-color: #4ade80; }
  </style>
</head>
<body>
  
  <div id="status-overlay">
    <div class="spinner" id="spinner"></div>
    <div class="status-title" id="status-title">INITIALIZING SYSTEM...</div>
    <div class="status-desc" id="status-desc">Connecting to local file system...</div>
  </div>

  <!-- CDN -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  
  <script>
    // --- LOCALHOST PROXY CHECKER ---
    // Decap CMS requires a local proxy server to write files directly to disk without login.
    // If this proxy isn't running, it falls back to Git Gateway (Login Page).
    // We check for the proxy availability to guide the user.
    (async function() {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        if (isLocalhost) {
            try {
                // Try to ping the local proxy server (default port 8081)
                // Note: This fetch might fail with CORS or network error if down, which we catch.
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                await fetch('http://localhost:8081/api/v1', { 
                    method: 'GET',
                    signal: controller.signal,
                    mode: 'no-cors' // We just care if it connects, not the content
                });
                
                clearTimeout(timeoutId);
                // If we get here, proxy is mostly likely UP.
                document.getElementById('status-title').innerText = "PROXY DETECTED";
                document.getElementById('status-desc').innerText = "Launching Admin Panel...";
                
            } catch (e) {
                // Proxy is DOWN
                console.warn("Local Proxy not detected:", e);
                const overlay = document.getElementById('status-overlay');
                const title = document.getElementById('status-title');
                const desc = document.getElementById('status-desc');
                const spinner = document.getElementById('spinner');
                
                spinner.style.display = 'none';
                title.style.color = '#ef4444'; // Red
                title.innerText = "LOCAL BACKEND DISCONNECTED";
                desc.innerHTML = `
                    The Admin Panel cannot write to files because the proxy is offline.<br><br>
                    To fix this and bypass login:<br>
                    1. Open a new terminal.<br>
                    2. Run the command below.<br>
                    3. Refresh this page.
                `;
                
                const cmd = document.createElement('div');
                cmd.className = 'cmd-box';
                cmd.innerText = '> npm run cms:proxy';
                cmd.onclick = () => { navigator.clipboard.writeText('npm run cms:proxy'); alert('Copied to clipboard!'); };
                overlay.appendChild(cmd);
                
                // Do not remove overlay, force user to see this
                return;
            }
        }
    })();

    // --- CMS INITIALIZATION ---
    window.addEventListener('load', function() {
        // Wait for CMS
        const checkInterval = setInterval(function() {
            if (window.CMS) {
                clearInterval(checkInterval);
                
                // Hide loader only if we didn't block it specifically above (though logic above runs parallel)
                // We use a small timeout to let the CMS render its UI
                setTimeout(() => {
                    const overlay = document.getElementById('status-overlay');
                    // Only hide if we haven't flagged an error
                    if (overlay && document.getElementById('status-title').innerText !== "LOCAL BACKEND DISCONNECTED") {
                        overlay.classList.add('hidden');
                        setTimeout(() => overlay.remove(), 500);
                    }
                }, 1000);

                // Register Previews
                try {
                    CMS.registerPreviewStyle("https://cdn.tailwindcss.com?plugins=typography");
                    CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
                    
                    var ArticlePreview = createClass({
                      render: function() {
                        var entry = this.props.entry;
                        var title = entry.getIn(['data', 'title']);
                        var body = this.props.widgetFor('body');
                        var thumbnail = entry.getIn(['data', 'thumbnail']);
                        
                        return h('div', { className: "prose prose-lg max-w-3xl mx-auto p-8 bg-white text-black min-h-screen" },
                          h('h1', { style: { lineHeight: '1.2', marginBottom: '1rem' } }, title),
                          thumbnail ? h('img', { src: this.props.getAsset(thumbnail), style: { borderRadius: '8px', marginBottom: '2rem' } }) : null,
                          h('div', {}, body)
                        );
                      }
                    });
                    CMS.registerPreviewTemplate("article_content", ArticlePreview);
                } catch(e) {}
            }
        }, 100);
    });
  </script>
</body>
</html>
