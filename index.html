    <!-- CRITICAL: Theme & Redirect Logic -->
    <script>
      (function() {
        // --- 1. ADMIN REDIRECT LOGIC ---
        // Robust check: works for root (/) and subdirectory (/repo/)
        var path = window.location.pathname;
        // Check if path contains /admin but is NOT the index.html
        if (path.indexOf('/admin') !== -1 && path.indexOf('/admin/index.html') === -1) {
            // Only redirect if it looks like they are trying to access the admin panel folder
            // This regex checks for ends with /admin or /admin/
            if (/\/admin\/?$/.test(path)) {
                window.stop();
                // Construct relative path to admin index
                // Note: On GH Pages, we might need to be careful, but absolute from root usually works
                // if base tag is not used. Since we are in SPA, we force a hard navigation.
                
                // Fix: Find where /admin starts and append index.html
                var newPath = path.substring(0, path.indexOf('/admin') + 6) + '/index.html';
                // Remove double slashes if any
                newPath = newPath.replace('//', '/');
                window.location.replace(newPath + window.location.search);
                return;
            }
        }

        // --- 2. THEME LOGIC ---
        // Force Dark Mode default for consistency with App.tsx
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#000000');
      })();
    </script>
