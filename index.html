    <!-- CRITICAL CSS: Layer Zero Optimizations -->
    <style>
      /* --- GLOBAL RESET & GPU HINTS --- */
      *, *::before, *::after { 
        box-sizing: border-box; 
        /* Remove mobile tap highlight color (Blue flash) */
        -webkit-tap-highlight-color: transparent;
      }

      html { 
        -webkit-text-size-adjust: 100%; 
        font-family: 'Inter', system-ui, sans-serif; 
        line-height: 1.5;
        height: 100%;
        /* Eliminate scroll lag on mobile */
        overscroll-behavior-y: none;
        scroll-behavior: smooth;
      }

      body { 
        margin: 0; 
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #ffffff;
        color: #000000;
        -webkit-font-smoothing: antialiased;
        /* Accelerate painting */
        transform: translateZ(0); 
        backface-visibility: hidden;
        /* Remove 300ms tap delay on old browsers & optimize interactions */
        touch-action: manipulation; 
      }

      /* Dark Mode Base */
      @media (prefers-color-scheme: dark) {
        body { background-color: #000000; color: #ffffff; }
      }

      #root { 
        display: flex; 
        flex-direction: column; 
        height: 100%; 
        width: 100%;
        /* Contain layout recalculations to root */
        contain: layout style; 
      }

      /* --- FONT OPTIMIZATION: Zero Layout Shift --- */
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        ascent-override: 89.67%;
        descent-override: 22.31%;
        line-gap-override: 0%;
        size-adjust: 107.6%;
      }
      body { font-family: 'Inter', 'Inter Fallback', sans-serif; }

      /* --- PERFORMANCE CLASSES --- */
      /* Use on long lists/articles to skip rendering off-screen content */
      .cv-auto { 
        content-visibility: auto; 
        contain-intrinsic-size: 1px 500px; 
      }
      
      /* GPU Promotion Class */
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform, opacity;
      }

      /* --- PRINT STYLES --- */
      @media print {
        body * { visibility: hidden; }
        .printable-area, .printable-area * { visibility: visible; }
        .printable-area { position: absolute; left: 0; top: 0; width: 100%; }
        .no-print, header, nav, aside { display: none !important; }
        html, body, #root { height: auto !important; overflow: visible !important; }
      }
    </style>
